<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La mappa di noi</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #hint { position: fixed; z-index: 5; inset: auto 16px 18px; padding: 11px 14px; border-radius: 12px; background: rgba(24, 15, 8, .82); color: #fff8ea; text-align: center; font-size: 14px; }
      #memory { display: none; position: fixed; z-index: 10; inset: 0; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, .55); }
      #card { max-width: 310px; padding: 24px; border: 2px solid #bd9158; border-radius: 16px; background: #f4e4c6; color: #332014; text-align: center; box-shadow: 0 10px 28px rgba(0, 0, 0, .35); }
      #card h2 { margin: 0 0 10px; font-size: 22px; }
      #card p { margin: 0 0 18px; line-height: 1.45; }
      #close { border: 0; border-radius: 8px; padding: 9px 16px; background: #6b3d25; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="hint">Inquadra la mappa intera per iniziare</div>
    <div id="memory" role="dialog" aria-modal="true">
      <div id="card">
        <h2 id="memory-title"></h2>
        <p id="memory-copy"></p>
        <button id="close">Chiudi</button>
      </div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/mappa.mind; maxTrack: 1; uiScanning: yes; uiLoading: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .place"></a-camera>

      <!-- Il rapporto 1.5 corrisponde alla mappa orizzontale. -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane position="0 0 0.02" width="0.76" height="0.18" color="#312014" opacity="0.88"></a-plane>
        <a-text value="Mappa riconosciuta" align="center" color="#fff4dc" width="1.0" position="0 0.025 0.04"></a-text>
        <a-text value="Il viaggio continua..." align="center" color="#e8bf7d" width="0.65" position="0 -0.045 0.04"></a-text>

        <!-- Pin temporanei: verranno poi spostati e associati ai ricordi scelti. -->
        <a-circle class="place" data-title="Punto prova 1" data-copy="Qui potremo mettere una foto, un video o un messaggio." color="#b7412d" radius="0.06" position="-0.34 -0.18 0.06"></a-circle>
        <a-text value="PROVA 1" align="center" color="#fff8ea" width="0.32" position="-0.34 -0.18 0.07"></a-text>
        <a-circle class="place" data-title="Punto prova 2" data-copy="Questo sarà un secondo ricordo interattivo." color="#b7412d" radius="0.06" position="0.34 0.19 0.06"></a-circle>
        <a-text value="PROVA 2" align="center" color="#fff8ea" width="0.32" position="0.34 0.19 0.07"></a-text>
      </a-entity>
    </a-scene>
    <script>
      const modal = document.querySelector('#memory');
      document.querySelectorAll('.place').forEach((place) => {
        place.addEventListener('click', () => {
          document.querySelector('#memory-title').textContent = place.dataset.title;
          document.querySelector('#memory-copy').textContent = place.dataset.copy;
          modal.style.display = 'flex';
        });
      });
      document.querySelector('#close').addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', (event) => { if (event.target === modal) modal.style.display = 'none'; });
    </script>
  </body>
</html>
