<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La mappa di noi</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      a-scene { position: fixed !important; inset: 0; z-index: 1 !important; }
      #hint { position: fixed; z-index: 20; inset: auto 16px 18px; padding: 11px 14px; border-radius: 12px; background: rgba(24, 15, 8, .82); color: #fff8ea; text-align: center; font-size: 14px; pointer-events: none; }
      #pins { display: none; position: fixed; z-index: 30; top: 18px; left: 50%; transform: translateX(-50%); width: min(92vw, 390px); gap: 10px; pointer-events: auto; }
      .pin-button { appearance: none; -webkit-appearance: none; border: 2px solid #f3d199; border-radius: 12px; padding: 13px 15px; background: #8f3025; color: #fff8ea; font-size: 16px; font-weight: 700; box-shadow: 0 3px 10px rgba(0, 0, 0, .35); touch-action: manipulation; }
      #memory { display: none; position: fixed; z-index: 40; inset: 0; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, .55); }
      #card { max-width: 310px; padding: 24px; border: 2px solid #bd9158; border-radius: 16px; background: #f4e4c6; color: #332014; text-align: center; box-shadow: 0 10px 28px rgba(0, 0, 0, .35); }
      #card h2 { margin: 0 0 10px; font-size: 22px; }
      #card p { margin: 0 0 18px; line-height: 1.45; }
      #close { border: 0; border-radius: 8px; padding: 9px 16px; background: #6b3d25; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="hint">Inquadra la mappa intera per iniziare</div>
    <div id="pins">
      <button class="pin-button" data-title="Punto prova 1" data-copy="Qui potremo mettere una foto, un video o un messaggio.">📍 Apri PROVA 1</button>
      <button class="pin-button" data-title="Punto prova 2" data-copy="Questo sarà un secondo ricordo interattivo.">📍 Apri PROVA 2</button>
    </div>
    <div id="memory" role="dialog" aria-modal="true">
      <div id="card">
        <h2 id="memory-title"></h2>
        <p id="memory-copy"></p>
        <button id="close">Chiudi</button>
      </div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./assets/mappa.mind; maxTrack: 1; uiScanning: yes; uiLoading: yes;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .place"></a-camera>

      <!-- Il rapporto 1.5 corrisponde alla mappa orizzontale. -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane position="0 0 0.02" width="0.76" height="0.18" color="#312014" opacity="0.88"></a-plane>
        <a-text value="Mappa riconosciuta" align="center" color="#fff4dc" width="1.0" position="0 0.025 0.04"></a-text>
        <a-text value="Il viaggio continua..." align="center" color="#e8bf7d" width="0.65" position="0 -0.045 0.04"></a-text>

        <!-- Effetto 3D temporaneo: una bussola che emerge dalla mappa. -->
        <a-entity position="0 -0.18 0.06"
          animation="property: position; to: 0 -0.18 0.22; dur: 1300; easing: easeOutElastic"
          animation__spin="property: rotation; to: 0 0 360; dur: 9000; easing: linear; loop: true">
          <a-cylinder radius="0.13" height="0.035" rotation="90 0 0" color="#c99c51" material="metalness: 0.55; roughness: 0.28"></a-cylinder>
          <a-circle radius="0.112" color="#f2ddb4" position="0 0 0.023"></a-circle>
          <a-torus radius="0.118" radius-tubular="0.009" color="#6b3d25" position="0 0 0.032"></a-torus>
          <a-triangle vertex-a="0 0.095 0.04" vertex-b="-0.025 -0.06 0.04" vertex-c="0.025 -0.06 0.04" color="#a6382b"></a-triangle>
          <a-triangle vertex-a="0 -0.095 0.04" vertex-b="-0.025 0.06 0.04" vertex-c="0.025 0.06 0.04" color="#41352b"></a-triangle>
          <a-text value="N" align="center" color="#6b3d25" width="0.12" position="0 0.128 0.045"></a-text>
        </a-entity>

        <!-- Aree di tocco volutamente grandi per funzionare bene su schermi piccoli. -->
        <a-plane class="place" data-title="Punto prova 1" data-copy="Qui potremo mettere una foto, un video o un messaggio." width="0.23" height="0.12" color="#a6382b" opacity="0.94" position="-0.33 -0.19 0.07" material="side: double">
          <a-text value="PROVA 1" align="center" color="#fff8ea" width="0.44" position="0 0 0.01"></a-text>
        </a-plane>
        <a-plane class="place" data-title="Punto prova 2" data-copy="Questo sarà un secondo ricordo interattivo." width="0.23" height="0.12" color="#a6382b" opacity="0.94" position="0.33 0.20 0.07" material="side: double">
          <a-text value="PROVA 2" align="center" color="#fff8ea" width="0.44" position="0 0 0.01"></a-text>
        </a-plane>

      </a-entity>
    </a-scene>
    <script>
      const modal = document.querySelector('#memory');
      const pins = document.querySelector('#pins');
      const target = document.querySelector('[mindar-image-target]');
      target.addEventListener('targetFound', () => { pins.style.display = 'grid'; });
      target.addEventListener('targetLost', () => { pins.style.display = 'none'; });
      document.querySelectorAll('.pin-button').forEach((button) => {
        const openMemory = () => {
          document.querySelector('#memory-title').textContent = button.dataset.title;
          document.querySelector('#memory-copy').textContent = button.dataset.copy;
          modal.style.display = 'flex';
        };
        button.addEventListener('click', openMemory);
        button.addEventListener('touchend', (event) => { event.preventDefault(); openMemory(); }, { passive: false });
      });
      // Su alcuni browser mobili il canvas AR intercetta il tocco prima del pulsante.
      // Questo gestore in cattura mantiene i pulsanti utilizzabili anche in quel caso.
      document.addEventListener('touchend', (event) => {
        const touch = event.changedTouches[0];
        document.querySelectorAll('.pin-button').forEach((button) => {
          const box = button.getBoundingClientRect();
          if (touch.clientX >= box.left && touch.clientX <= box.right && touch.clientY >= box.top && touch.clientY <= box.bottom) {
            event.preventDefault();
            document.querySelector('#memory-title').textContent = button.dataset.title;
            document.querySelector('#memory-copy').textContent = button.dataset.copy;
            modal.style.display = 'flex';
          }
        });
      }, { capture: true, passive: false });
      document.querySelector('#close').addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', (event) => { if (event.target === modal) modal.style.display = 'none'; });
    </script>
  </body>
</html>
